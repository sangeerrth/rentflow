<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>RentFlow pay test</title>
</head>

<body style="font-family: sans-serif; max-width: 480px; margin: 40px auto;">
    <h3>RentFlow payment test</h3>
    <p>Tenant token:<br><input id="token" style="width:100%"></p>
    <p>Invoice id:<br><input id="invoice" value="1"></p>
    <button id="payBtn">Pay</button>
    <pre id="out"></pre>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        const out = document.getElementById('out');
        const headers = () => ({
            'Accept': 'application/json',
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + document.getElementById('token').value.trim()
        });

        document.getElementById('payBtn').onclick = async () => {
            const id = document.getElementById('invoice').value;
            const res = await fetch('/api/invoices/' + id + '/pay', { method: 'POST', headers: headers() });
            const order = await res.json();
            if (!res.ok) { out.textContent = JSON.stringify(order, null, 2); return; }

            const rzp = new Razorpay({
                key: order.key,
                amount: order.amount,
                currency: order.currency,
                order_id: order.order_id,
                name: 'RentFlow',
                description: 'Rent invoice #' + id,
                handler: async (response) => {
                    const v = await fetch('/api/payments/verify', {
                        method: 'POST', headers: headers(), body: JSON.stringify(response)
                    });
                    out.textContent = JSON.stringify(await v.json(), null, 2);
                }
            });
            rzp.open();
        };
    </script>
</body>

</html>
